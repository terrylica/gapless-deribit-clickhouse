# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# gapless-deribit-clickhouse — repo tasks.
#
#   moon run deribit:check       offline gate: lint + unit tests + contract tests + security scans
#   moon run deribit:<task>      any single task below
#
# Tasks that need ClickHouse credentials (schema-validate, test-e2e, validate-*) read them from the
# gitignored .env, which the Python code loads itself (see .env.example). They are uncached and
# never part of `check`.
layer: 'library'
language: 'python'

# validation/infrastructure.py defaults CLICKHOUSE_MODE to "local" while clickhouse/connection.py
# defaults to "cloud"; set it here so the validation report labels the real (cloud) target.
env:
  CLICKHOUSE_MODE: 'cloud'

tasks:
  sync:
    script: 'uv sync --all-extras'
    options: { cache: false }
  format:
    script: 'uv run ruff format src/ tests/'
    options: { cache: false }
  lint:
    script: 'uv run ruff check src/'
    inputs: ['src/**/*', 'pyproject.toml']
  test:
    script: "uv run --all-extras pytest tests/ -v -m 'not slow and not e2e'"
    inputs: ['src/**/*', 'tests/**/*', 'pyproject.toml', 'uv.lock']
  test-contracts:
    script: 'uv run pytest tests/contracts/ -v'
    inputs: ['src/**/*', 'tests/contracts/**/*', 'schema/**/*', 'pyproject.toml']
  security:
    script: 'semgrep scan --config auto src/ && gitleaks detect --source .'
    options: { cache: false }
  check:
    deps: ['~:lint', '~:test', '~:test-contracts', '~:security']
    script: "echo 'deribit:check passed'"
    options: { cache: false }

  # ── Need credentials in .env and the live ClickHouse Cloud service; run by hand ──
  schema-validate:
    script: 'uv run python -m gapless_deribit_clickhouse.schema.cli validate'
    options: { cache: false }
  test-e2e:
    script: 'uv run pytest tests/e2e/ -v -m e2e'
    options: { cache: false }
  validate-pipeline:
    script: >-
      uv run python -m gapless_deribit_clickhouse.validation.infrastructure &&
      uv run python -m gapless_deribit_clickhouse.validation.data_quality &&
      uv run python -m gapless_deribit_clickhouse.validation.reporter
    options: { cache: false }

  # ── DBeaver connection config (Pydantic SSoT → .dbeaver/data-sources.json) ──
  dbeaver-generate:
    script: 'uv run scripts/generate_dbeaver_config.py'
    options: { cache: false }
  dbeaver-validate:
    script: 'uv run scripts/validate_dbeaver_config.py'
    options: { cache: false }
